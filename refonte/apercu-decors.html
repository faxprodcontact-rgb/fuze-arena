<!doctype html>
<!-- Aperçu des décors de combat (refonte) : ?t=forest,cave… ; chaque thème en portrait (téléphone) et en paysage,
     avec un héros et un monstre à la bonne taille. À ouvrir via un petit serveur (python3 -m http.server). -->
<meta charset="utf-8">
<body style="margin:0;padding:12px;background:#15122a;color:#fff;font:13px sans-serif">
<div id="out" style="display:flex;flex-direction:column;gap:14px"></div>
<script type="module">
import { paintScene, loadDecorArt } from '../js/battle.js';
import { loadHeroArt, loadMonsterArt, heroCanvas, monsterCanvas, lw, lh } from '../js/sprites.js';
await Promise.all([loadDecorArt(), loadHeroArt(), loadMonsterArt()]);
const q = new URLSearchParams(location.search);
const themes = (q.get('t') || 'arena,cave,forest,crypt,swamp,mine,volcano,glacier,castle,training,meeting,abyss').split(',');
const mon = { arena: 'goblin', cave: 'slimeKing', forest: 'wolf', crypt: 'skeleton', swamp: 'mushroom', mine: 'golem', volcano: 'fireElem', glacier: 'yeti', castle: 'vampire', training: 'scarecrow', meeting: 'melenchon', abyss: 'demon' };
const out = document.getElementById('out');
function scene(theme, W, H, GROUND, px, portrait) {
  const c = document.createElement('canvas'); c.width = W * px; c.height = H * px;
  const x = c.getContext('2d'); x.setTransform(px, 0, 0, px, 0, 0);
  paintScene(x, theme, W, H, GROUND, 3, true);
  const hero = heroCanvas('guerrier');
  const hs = 28 * 1.15 * 3, hw = hs * lw(hero) / lh(hero);
  x.imageSmoothingEnabled = true;
  x.drawImage(hero, (portrait ? 0.25 : 0.3125) * W - hw / 2, GROUND - hs, hw, hs);
  const m = monsterCanvas(mon[theme] || 'goblin');
  const mh = lh(m) * 4, mw = lw(m) * 4;
  x.save(); x.translate((portrait ? 0.75 : 0.6875) * W, 0); x.scale(-1, 1); x.drawImage(m, -mw / 2, GROUND - mh, mw, mh); x.restore();
  return c;
}
for (const t of themes) {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:12px;align-items:flex-start';
  const lab = document.createElement('div'); lab.textContent = t; lab.style.width = '70px';
  const H = Math.round(240 * 2.16);
  const a = scene(t, 240, H, Math.round(H * 0.62), 1.5, true); a.style.width = '360px';
  const b = scene(t, 480, 270, 228, 1.25, false); b.style.width = '600px';
  row.append(lab, a, b); out.append(row);
}
document.title = 'ok';
</script>
